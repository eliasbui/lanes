<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lanes</title>
    <script>
      // The app puts the language, the light or dark and the glass of the settings on the root (main.rs `page`); the
      // classes the styles follow are set from them here, before the first frame, and again when the system changes.
      (() => {
        const root = document.documentElement;
        const system = matchMedia("(prefers-color-scheme: dark)");
        window.paintTheme = () => {
          const theme = root.dataset.theme || "system";
          root.classList.toggle("dark", theme === "dark" || (theme !== "light" && system.matches));
          root.classList.toggle("glass", root.hasAttribute("data-glass"));
        };
        paintTheme();
        system.addEventListener("change", paintTheme);
      })();
    </script>
    <style>
      /* macOS colours: the system's own where WebKit names them (the user's accent), Apple's values elsewhere. */
      :root {
        color-scheme: light;
        --accent: #007aff;
        --window: #ffffff;
        --sidebar: rgba(242, 242, 245, 0.94);
        --sidebar-stroke: rgba(0, 0, 0, 0.07);
        --label: rgba(0, 0, 0, 0.88);
        --secondary: rgba(0, 0, 0, 0.52);
        --tertiary: rgba(0, 0, 0, 0.28);
        --separator: rgba(0, 0, 0, 0.08);
        --hover: rgba(0, 0, 0, 0.05);
        --pressed: rgba(0, 0, 0, 0.1);
        --selected: rgba(0, 0, 0, 0.07);
        --glass: rgba(255, 255, 255, 0.78);
        --glass-stroke: rgba(0, 0, 0, 0.08);
        --field: rgba(0, 0, 0, 0.045);
        --field-stroke: rgba(0, 0, 0, 0.12);
        --field-bg: #ffffff;
        --btn: #ffffff;
        --btn-stroke: rgba(0, 0, 0, 0.13);
        --panel: #f5f5f7;
        --panel-stroke: rgba(0, 0, 0, 0.1);
        --group: #ffffff;
        --group-stroke: rgba(0, 0, 0, 0.06);
        --track: rgba(0, 0, 0, 0.1);
        --menu: rgba(246, 246, 246, 0.88);
        --content: transparent;
        --rim: transparent;
        --red: #ff3b30;
        --green: #28cd41;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
      }
      @supports (color: -apple-system-control-accent) {
        :root { --accent: -apple-system-control-accent; }
      }
      /* Dark, when the user or the system asks for it (the root's class, set by the script in the head). */
      :root.dark {
        color-scheme: dark;
        --window: #1e1e1e;
        --sidebar: rgba(46, 46, 48, 0.94);
        --sidebar-stroke: rgba(255, 255, 255, 0.07);
        --label: rgba(255, 255, 255, 0.9);
        --secondary: rgba(255, 255, 255, 0.55);
        --tertiary: rgba(255, 255, 255, 0.28);
        --separator: rgba(255, 255, 255, 0.08);
        --hover: rgba(255, 255, 255, 0.06);
        --pressed: rgba(255, 255, 255, 0.12);
        --selected: rgba(255, 255, 255, 0.1);
        --glass: rgba(58, 58, 60, 0.8);
        --glass-stroke: rgba(255, 255, 255, 0.09);
        --field: rgba(255, 255, 255, 0.08);
        --field-stroke: rgba(255, 255, 255, 0.1);
        --field-bg: rgba(255, 255, 255, 0.06);
        --btn: rgba(255, 255, 255, 0.13);
        --btn-stroke: rgba(255, 255, 255, 0.06);
        --panel: #2a2a2c;
        --panel-stroke: rgba(255, 255, 255, 0.1);
        --group: rgba(255, 255, 255, 0.05);
        --group-stroke: rgba(255, 255, 255, 0.05);
        --track: rgba(255, 255, 255, 0.14);
        --menu: rgba(42, 42, 44, 0.88);
        --red: #ff453a;
        --green: #32d74b;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      /* Liquid Glass (beta): the sidebar, the toolbar's capsules, the sheets and the groups of Settings turn to frosted
         glass with a light along their top edge, over a soft coloured backdrop that the content lets through. */
      :root.glass {
        --window: #e8eef8;
        --sidebar: rgba(255, 255, 255, 0.42);
        --sidebar-stroke: rgba(255, 255, 255, 0.55);
        --glass: rgba(255, 255, 255, 0.5);
        --glass-stroke: rgba(255, 255, 255, 0.6);
        --panel: rgba(250, 250, 252, 0.72);
        --group: rgba(255, 255, 255, 0.55);
        --group-stroke: rgba(255, 255, 255, 0.6);
        --menu: rgba(250, 250, 252, 0.66);
        --content: rgba(255, 255, 255, 0.55);
        --rim: rgba(255, 255, 255, 0.75);
        --field-bg: rgba(255, 255, 255, 0.7);
      }
      :root.glass.dark {
        --window: #0f1117;
        --sidebar: rgba(44, 46, 54, 0.42);
        --sidebar-stroke: rgba(255, 255, 255, 0.12);
        --glass: rgba(60, 62, 72, 0.45);
        --glass-stroke: rgba(255, 255, 255, 0.12);
        --panel: rgba(36, 38, 44, 0.72);
        --group: rgba(255, 255, 255, 0.06);
        --group-stroke: rgba(255, 255, 255, 0.1);
        --menu: rgba(40, 42, 48, 0.66);
        --content: rgba(24, 25, 30, 0.5);
        --rim: rgba(255, 255, 255, 0.22);
        --field-bg: rgba(255, 255, 255, 0.07);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 13px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        color: var(--label);
        background: var(--window);
        overflow: hidden;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      input, textarea { -webkit-user-select: text; user-select: text; }
      button { font: inherit; color: inherit; cursor: default; }
      svg { display: block; }
      :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
      /* macOS draws its own overlay scrollbars; elsewhere a thin one in the same spirit. */
      html:not(.mac) ::-webkit-scrollbar { width: 10px; }
      html:not(.mac) ::-webkit-scrollbar-thumb { background: var(--track); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }

      /* The coloured light under the glass. */
      .backdrop { display: none; position: fixed; inset: -15%; z-index: -1; filter: blur(70px) saturate(140%); }
      .glass .backdrop {
        display: block;
        background:
          radial-gradient(38% 40% at 16% 20%, #7cc0ff 0%, transparent 62%),
          radial-gradient(36% 38% at 86% 14%, #c3a2ff 0%, transparent 62%),
          radial-gradient(44% 44% at 74% 86%, #5fe0ff 0%, transparent 64%),
          radial-gradient(40% 40% at 22% 88%, #9af5d4 0%, transparent 62%);
      }
      .glass.dark .backdrop { opacity: 0.45; }
      .glass .sidebar, .glass .capsule, .glass .panel, .glass .ctx, .glass .toast, .glass .banner, .glass .group {
        -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%);
      }
      .glass .sidebar, .glass .capsule, .glass .panel, .glass .group { box-shadow: inset 0 1px 0 var(--rim), 0 0 0 0.5px var(--glass-stroke), 0 8px 28px rgba(20, 30, 60, 0.12); }
      .glass main { background: var(--content); }

      .app { display: grid; grid-template-columns: 228px minmax(0, 1fr); height: 100%; }

      /* The sidebar floats inset in the window, as on macOS 26, and holds the window's buttons at its top. */
      .sidebar {
        margin: 8px 0 8px 8px;
        border-radius: 18px;
        background: var(--sidebar);
        box-shadow: 0 0 0 0.5px var(--sidebar-stroke), 0 2px 10px rgba(0, 0, 0, 0.06);
        display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      }
      .side-top { height: 10px; flex: none; }
      .mac .side-top { height: 44px; }
      nav { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
      .side-foot { flex: none; padding: 6px 10px 10px; border-top: 1px solid var(--separator); }
      .section { font-size: 11px; font-weight: 600; color: var(--secondary); padding: 12px 8px 4px; }
      .nav-item {
        display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px;
        border: 0; border-radius: 8px; background: transparent; text-align: left;
      }
      .nav-item:hover { background: var(--hover); }
      .nav-item.on { background: var(--selected); }
      .nav-item svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
      .nav-item .count { margin-left: auto; color: var(--secondary); font-size: 12px; font-variant-numeric: tabular-nums; }

      main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      /* The list and Settings share the window; each shows what is its own. */
      main.settings .list-only, main:not(.settings) .settings-only { display: none !important; }

      .toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 20px; }
      .titles { min-width: 0; display: flex; flex-direction: column; }
      .titles h1 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .titles span { font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      .spacer { flex: 1; }
      .capsule {
        display: flex; align-items: center; gap: 2px; height: 34px; padding: 0 3px; flex: none;
        border-radius: 999px; background: var(--glass); box-shadow: 0 0 0 0.5px var(--glass-stroke), var(--shadow);
        -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
      }
      .tb {
        height: 28px; min-width: 32px; padding: 0 7px; border: 0; border-radius: 999px; background: transparent;
        display: flex; align-items: center; justify-content: center; gap: 5px; color: var(--label);
      }
      .tb:hover { background: var(--hover); }
      .tb:active { background: var(--pressed); }
      .tb:disabled { opacity: 0.35; background: transparent; }
      .tb svg { width: 17px; height: 17px; }
      .tb.tab { padding: 0 12px; font-weight: 500; }
      .tb.tab svg { width: 15px; height: 15px; }
      .tb.tab.on { background: var(--btn); box-shadow: 0 0 0 0.5px var(--btn-stroke), 0 1px 2px rgba(0, 0, 0, 0.12); }
      .search { width: 210px; height: 34px; padding: 0 12px; gap: 6px; }
      .search svg { width: 15px; height: 15px; color: var(--secondary); flex: none; }
      .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; color: var(--label); }
      .search input::placeholder { color: var(--secondary); }
      @media (max-width: 760px) { .search { width: 140px; } .tb.tab span { display: none; } }

      .scroll { flex: 1; overflow-y: auto; padding: 2px 12px 12px; }

      /* The list, rows as in Finder: a file's icon, its name and progress, and its buttons. */
      .row {
        position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center;
        padding: 9px 10px; border-radius: 10px;
      }
      .row:not(:first-child)::before { content: ""; position: absolute; top: 0; left: 54px; right: 10px; height: 1px; background: var(--separator); transform: scaleY(0.5); }
      .row.sel::before, .row.sel + .row::before { display: none; }
      .row.sel { background: var(--accent); color: #fff; }
      .inactive .row.sel { background: var(--selected); color: var(--label); }
      .icon { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
      .icon svg { width: 17px; height: 17px; }
      .icon.Video { background: linear-gradient(180deg, #bf5af2, #8e44d6); }
      .icon.Music { background: linear-gradient(180deg, #ff6482, #ff2d55); }
      .icon.Documents { background: linear-gradient(180deg, #4ea8ff, #0a6cff); }
      .icon.Compressed { background: linear-gradient(180deg, #c4a37e, #9a7a55); }
      .icon.Programs { background: linear-gradient(180deg, #5ee27a, #23b14a); }
      .icon.other { background: linear-gradient(180deg, #a5a5ab, #7c7c82); }
      .meta { min-width: 0; }
      .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag { font-size: 10px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
      .sub { font-size: 11px; color: var(--secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
      .sub.err { color: var(--red); }
      .row.sel .sub, .row.sel .sub.err { color: rgba(255, 255, 255, 0.82); }
      .row.sel .tag { color: #fff; background: rgba(255, 255, 255, 0.22); }
      .inactive .row.sel .sub { color: var(--secondary); }
      .bar { height: 4px; border-radius: 2px; background: var(--track); margin-top: 6px; overflow: hidden; }
      .fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.4s ease; }
      .fill.paused { background: var(--tertiary); }
      .fill.error { background: var(--red); }
      .row.sel .bar { background: rgba(255, 255, 255, 0.3); }
      .row.sel .fill { background: #fff; }
      .right { display: flex; align-items: center; gap: 2px; }
      .act { width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; color: var(--secondary); display: grid; place-items: center; }
      .act:hover { background: var(--hover); color: var(--label); }
      .act:active { background: var(--pressed); }
      .act svg { width: 15px; height: 15px; }
      .act.rm { opacity: 0; }
      .row:hover .act.rm, .row.sel .act.rm { opacity: 1; }
      .row.sel .act { color: #fff; }
      .row.sel .act:hover { background: rgba(255, 255, 255, 0.18); }

      .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 0 24px 40px; }
      .empty svg { width: 54px; height: 54px; color: var(--tertiary); margin-bottom: 4px; }
      .empty h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .empty p { margin: 0 0 8px; color: var(--secondary); max-width: 340px; }

      /* Buttons and fields as macOS draws them. */
      .push {
        height: 28px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--btn); color: var(--label);
        font-weight: 500; white-space: nowrap; box-shadow: 0 0 0 0.5px var(--btn-stroke), 0 0.5px 1.5px rgba(0, 0, 0, 0.1);
      }
      .push:active { filter: brightness(0.94); }
      .push.primary { background: var(--accent); color: #fff; box-shadow: 0 0.5px 1.5px rgba(0, 0, 0, 0.15); }
      .push:disabled { opacity: 0.5; }
      .field {
        height: 28px; padding: 0 10px; border: 0; border-radius: 8px; outline: none; background: var(--field-bg); color: var(--label);
        font: inherit; box-shadow: 0 0 0 0.5px var(--field-stroke), inset 0 0.5px 1px rgba(0, 0, 0, 0.05); min-width: 0;
      }
      .field:focus { box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
      .field::placeholder { color: var(--tertiary); }
      textarea.field { height: auto; padding: 8px 10px; resize: vertical; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
      .wide { width: 100%; }
      .beta { font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; color: #fff; background: #ff9500; padding: 1px 6px; border-radius: 999px; vertical-align: 1px; }

      .switch { position: relative; width: 38px; height: 22px; flex: none; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .knob { position: absolute; inset: 0; border-radius: 11px; background: var(--track); transition: background 0.2s ease; }
      .knob::before {
        content: ""; position: absolute; width: 20px; height: 20px; left: 1px; top: 1px; border-radius: 50%; background: #fff;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.25); transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.4, 1);
      }
      .switch input:checked + .knob { background: var(--accent); }
      .switch input:checked + .knob::before { transform: translateX(16px); }
      .switch input:focus-visible + .knob { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }

      input[type="range"] {
        -webkit-appearance: none; appearance: none; width: 160px; height: 4px; border-radius: 2px; outline: none;
        background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--track) var(--p, 0%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.28);
      }

      .segmented { display: flex; padding: 2px; border-radius: 999px; background: var(--field); }
      .panel .segmented { margin-bottom: 12px; }
      .seg { flex: 1; height: 24px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font-weight: 500; white-space: nowrap; }
      .seg.on { background: var(--btn); box-shadow: 0 0 0 0.5px var(--btn-stroke), 0 1px 2px rgba(0, 0, 0, 0.12); }

      /* Sheets come down from the top of the window, over a dimmed one. */
      .modal { position: fixed; inset: 0; z-index: 20; display: none; justify-content: center; align-items: flex-start; padding: 56px 16px 16px; background: rgba(0, 0, 0, 0.14); }
      .modal.open { display: flex; }
      .panel {
        width: min(480px, 100%); max-height: 100%; overflow-y: auto; padding: 20px; border-radius: 22px; background: var(--panel);
        box-shadow: 0 0 0 0.5px var(--panel-stroke), 0 22px 70px rgba(0, 0, 0, 0.3);
        animation: sheet 0.24s cubic-bezier(0.32, 0.72, 0, 1);
      }
      @keyframes sheet { from { transform: translateY(-14px) scale(0.98); opacity: 0; } }
      .panel h2 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
      .lead { margin: 0 0 14px; color: var(--secondary); }
      .hint { margin: 8px 0 0; color: var(--secondary); font-size: 11.5px; }
      .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

      /* Settings, a tab at a time, grouped rows as in System Settings. */
      .settings-page { max-width: 640px; margin: 0 auto; padding: 0 8px 24px; }
      .tab-page:not(.on) { display: none; }
      .group-title { font-size: 12px; font-weight: 600; color: var(--secondary); margin: 16px 4px 6px; }
      .group { background: var(--group); border-radius: 12px; box-shadow: 0 0 0 0.5px var(--group-stroke); }
      .item { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px; min-height: 42px; }
      .item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--separator); transform: scaleY(0.5); }
      .item .label { flex: 1; min-width: 0; }
      .item .label small { display: block; margin-top: 2px; font-size: 11px; line-height: 1.4; color: var(--secondary); }
      .item .control { flex: none; display: flex; align-items: center; gap: 8px; }
      .item.stack { flex-direction: column; align-items: stretch; gap: 8px; }
      .item.stack .control { flex: 1; }
      .item.stack .control .field { flex: 1; }
      .value { min-width: 20px; text-align: right; font-variant-numeric: tabular-nums; color: var(--secondary); }
      select { font: inherit; color: var(--label); min-width: 150px; max-width: 200px; }
      input[type="time"].field { width: 96px; font-variant-numeric: tabular-nums; }

      .nets { display: flex; flex-direction: column; gap: 4px; }
      .nets:empty { display: none; }
      .net { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 8px; background: var(--field); font-size: 12px; }
      .net-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .net-state { flex: none; color: var(--secondary); font-variant-numeric: tabular-nums; }
      .net-state.up { color: var(--green); }
      .net-state.down { color: var(--red); }

      /* The right-click menu, as macOS draws one. */
      .ctx {
        position: fixed; z-index: 40; min-width: 210px; padding: 5px; border-radius: 12px; display: none;
        background: var(--menu); box-shadow: 0 0 0 0.5px var(--panel-stroke), 0 10px 34px rgba(0, 0, 0, 0.22);
        -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
      }
      .ctx.open { display: block; }
      .ctx button { display: block; width: 100%; height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
      .ctx button:hover { background: var(--accent); color: #fff; }
      .ctx hr { height: 1px; margin: 5px 10px; border: 0; background: var(--separator); }

      .banner {
        position: fixed; left: 50%; bottom: 16px; z-index: 30; display: flex; align-items: center; gap: 12px; max-width: calc(100vw - 32px);
        padding: 8px 8px 8px 16px; border-radius: 999px; background: var(--glass); box-shadow: 0 0 0 0.5px var(--glass-stroke), 0 10px 30px rgba(0, 0, 0, 0.18);
        -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
        transform: translate(-50%, 160%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .banner.show { transform: translate(-50%, 0); }
      .toast {
        position: fixed; left: 50%; top: 58px; z-index: 50; max-width: calc(100vw - 32px); padding: 8px 16px; border-radius: 999px;
        background: var(--glass); box-shadow: 0 0 0 0.5px var(--glass-stroke), 0 8px 26px rgba(0, 0, 0, 0.16); font-weight: 500; text-align: center;
        -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
        opacity: 0; transform: translate(-50%, -8px); transition: opacity 0.2s ease, transform 0.25s ease; pointer-events: none;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="app">
      <aside class="sidebar">
        <div class="side-top drag"></div>
        <nav id="nav"></nav>

          const id = seq++;

        });

          classifyHint: "As IDM does: archives go into Compressed, documents into Documents, music into Music, programs into Programs and videos into Video, all in the download folder. Other files stay in the folder itself.",
          maxActive: "Downloads at once", maxActiveHint: "The others wait in the queue and start as room opens up.", unlimited: "No limit",
          speed: "Speed limit", speedHint: "Over every download together, so the network has room for the rest.",
          schedule: "Start at a set time", scheduleOff: "The queue waits for this time to start, once, as for a download at night.",
          scheduleOn: "The queue starts at {0}. Files added until then wait.",
          whenDone: "When everything is done", whenDoneHint: "Lanes waits a minute first, then goes back to Do nothing.", nothing: "Do nothing", sleep: "Sleep", shutdown: "Shut down",
          netMerge: "net-merge: use every network link",
          netMergeHint: "The connections of each download are spread over Wi-Fi, Ethernet and a phone sharing its connection over USB at once, so a file comes at the speed of them all together. No administrator rights are needed, and only Lanes' downloads take part. The first connection to each site takes the default link, another link takes a site only once it has been checked against it, and nothing is merged while a VPN carries all traffic.",
          netIdle: "Ready", netChecking: "Checking...", netUp: "Running", netDown: "No internet", netDefault: "default", netCarries: "{0} connections · {1}/s",
          netVpn: "A VPN carries all traffic, so nothing is merged: downloads go through the VPN as before.", netNone: "No network link was found.",
          netOne: "There is one network link so far. Plug in a phone over USB with Personal Hotspot on, or an Ethernet cable, to add another.",
          updateOut: "Lanes {0} is out. You have {1}.", update: "Update", updating: "Downloading...", updatingPct: "Downloading {0}%",
          updateReady: "The new version is ready. Restart to use it.", restart: "Restart",
        },
      };
      let lang = root.lang === "en" ? "en" : "vi";
      const t = (key, ...args) => (WORDS[lang][key] ?? WORDS.vi[key] ?? key).replace(/\{(\d)\}/g, (_, i) => args[i]);

      // The static words of the page: data-t is an element's text, data-tp a placeholder, data-tt a button's title and
      // label, data-tl a label for assistive technology.
      function applyLang() {
        root.lang = lang;
        for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
        for (const el of document.querySelectorAll("[data-tp]")) el.placeholder = t(el.dataset.tp);
        for (const el of document.querySelectorAll("[data-tt]")) { el.title = t(el.dataset.tt); el.setAttribute("aria-label", t(el.dataset.tt)); }
        for (const el of document.querySelectorAll("[data-tl]")) el.setAttribute("aria-label", t(el.dataset.tl));
      }

      // Download states, matching engine::state.
      const QUEUED = 0, RUNNING = 1, PAUSED = 2, DONE = 3, ERROR = 4;

      function human(n) {
        if (n == null) return "-";
        const u = ["B", "KB", "MB", "GB", "TB"];
        let i = 0;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return (i === 0 ? n : n.toFixed(n < 10 ? 1 : 0)) + " " + u[i];
      }
      function eta(sec) {
        if (!isFinite(sec) || sec <= 0) return "";
        if (sec < 60) return t("seconds", Math.round(sec));
        if (sec < 3600) return t("minutes", Math.round(sec / 60));
        return t("hours", (sec / 3600).toFixed(1));
      }
      function esc(s) {
        return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }
      function host(url) {
        try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; }
      }
      const svg = (path, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${path}</svg>`;
      const line = (d, w = 1.8) => `<path d="${d}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

      // The file icons, one per category of the engine (engine::category), and the buttons of a row.
      const GLYPH = {
        Video: '<path d="M9 7.2v9.6a.6.6 0 00.9.5l7.6-4.8a.6.6 0 000-1L9.9 6.7a.6.6 0 00-.9.5z" fill="currentColor"/>',
        Music: line("M10 17.5V7l8-2v10.5", 1.9) + '<circle cx="7.8" cy="17.5" r="2.3" fill="currentColor"/><circle cx="15.8" cy="15.5" r="2.3" fill="currentColor"/>',
        Documents: line("M8 4h6l4 4v12H8z") + line("M10.5 12h5M10.5 15.5h5"),
        Compressed: line("M5 8h14v11H5zM4 5h16v3H4zM10 12h4"),
        Programs: line("M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"),
        other: line("M8 4h6l4 4v12H8z") + line("M14 4v4h4"),
      };
      const ACT = {
        pause: line("M9 7v10M15 7v10", 2.2),
        resume: '<path d="M8.5 6.2v11.6a.6.6 0 00.9.5l9.1-5.8a.6.6 0 000-1L9.4 5.7a.6.6 0 00-.9.5z" fill="currentColor"/>',
        reveal: '<circle cx="10.5" cy="10.5" r="5.5" stroke="currentColor" stroke-width="2"/>' + line("M14.8 14.8l4.2 4.2", 2.2),
        remove: line("M7.5 7.5l9 9M16.5 7.5l-9 9", 2),
      };
      const act = (name, cls = "") => `<button class="act ${cls}" data-act="${name}" title="${t(name)}" aria-label="${t(name)}">${svg(ACT[name])}</button>`;

      // The sidebar: the downloads by state, then by type of file.
      const NAV = [
        { section: "secDownloads" },
        { id: "all", icon: line("M4 13.5l2.2-7.1A2 2 0 018.1 5h7.8a2 2 0 011.9 1.4l2.2 7.1V18a2 2 0 01-2 2H6a2 2 0 01-2-2v-4.5zM4 13.5h4.5l1 2h5l1-2H20"), test: () => true },
        { id: "active", icon: '<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/>' + line("M12 7.5v8m0 0l-3.2-3.2M12 15.5l3.2-3.2"), test: (it) => it.state === RUNNING || it.state === QUEUED },
        { id: "done", icon: '<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/>' + line("M8.3 12.3l2.6 2.6 5-5.2"), test: (it) => it.state === DONE },
        { id: "stopped", icon: '<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/>' + line("M10 9v6M14 9v6"), test: (it) => it.state === PAUSED || it.state === ERROR },
        { section: "secKinds" },
        { id: "Video", icon: line("M4 6.5h16v11H4z") + line("M10.5 9.8v4.4l3.8-2.2z"), test: (it) => it.category === "Video" },
        { id: "Music", icon: line("M10 17.5V7l8-2v10.5") + '<circle cx="7.8" cy="17.5" r="2.3" stroke="currentColor" stroke-width="1.8"/><circle cx="15.8" cy="15.5" r="2.3" stroke="currentColor" stroke-width="1.8"/>', test: (it) => it.category === "Music" },
        { id: "Documents", icon: GLYPH.Documents, test: (it) => it.category === "Documents" },
        { id: "Compressed", icon: GLYPH.Compressed, test: (it) => it.category === "Compressed" },
        { id: "Programs", icon: GLYPH.Programs, test: (it) => it.category === "Programs" },
        { id: "other", icon: GLYPH.other, test: (it) => !it.category },
      ];
      const views = NAV.filter((n) => n.id);
      $("nav").innerHTML = NAV.map((n) =>
        n.section
          ? `<div class="section" data-t="${n.section}"></div>`
          : `<button class="nav-item" data-view="${n.id}">${svg(n.icon)}<span data-t="${n.id}"></span><span class="count"></span></button>`
      ).join("");

      // Settings, one tab at a time.
      const TABS = [
        { id: "general", icon: line("M4 7h16M4 12h16M4 17h10") },
        { id: "look", icon: '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/>' },
        { id: "downloads", icon: line("M12 4.5v10m0 0l-4-4m4 4l4-4M5.5 19h13") },
        { id: "queue", icon: line("M5 7h14M5 12h14M5 17h9") + line("M17.5 15.5v4M15.5 17.5h4") },
        { id: "network", icon: line("M4.5 9.5a11 11 0 0115 0M7.5 12.8a6.8 6.8 0 019 0M10.5 16a2.5 2.5 0 013 0") },
      ];
      const tabKey = (id) => "tab" + id[0].toUpperCase() + id.slice(1);
      $("tabs").innerHTML = TABS.map((tab) => `<button class="tb tab" role="tab" data-tab="${tab.id}">${svg(tab.icon)}<span data-t="${tabKey(tab.id)}"></span></button>`).join("");

      let items = [];
      // The queue's start time (seconds since 1970, 0 for none) and the speed limit, as the app keeps them.
      let startAt = 0;
      let speedLimit = 0;
      let lastNet = null;
      const waiting = () => startAt * 1000 > Date.now();
      const two = (n) => String(n).padStart(2, "0");
      const clock = (sec) => { const d = new Date(sec * 1000); return `${two(d.getHours())}:${two(d.getMinutes())}`; };
      const when = (sec) => (new Date(sec * 1000).toDateString() === new Date().toDateString() ? clock(sec) : t("tomorrow", clock(sec)));
      let view = "all";
      let lastList = "all";
      let tab = "general";
      let query = "";
      let selected = null;

      function go(next) {
        if (next !== "settings") lastList = next;
        view = next;
        closeMenu();
        draw();
      }
      $("nav").addEventListener("click", (e) => {
        const item = e.target.closest("[data-view]");
        if (item) go(item.dataset.view);
      });
      document.querySelector(".side-foot").addEventListener("click", () => go("settings"));
      $("tabs").addEventListener("click", (e) => {
        const button = e.target.closest("[data-tab]");
        if (!button) return;
        tab = button.dataset.tab;
        draw();
      });
      $("search").addEventListener("input", () => {
        query = $("search").value.trim().toLowerCase();
        draw();
      });

      function subline(it) {
        if (it.state === RUNNING) {
          const left = it.size && it.speed ? eta((it.size - it.downloaded) / it.speed) : "";
          const parts = [`${human(it.downloaded)} / ${human(it.size)}`, `${human(it.speed)}/s`];
          if (left) parts.push(t("left", left));
          parts.push(t("nConns", it.connections));
          if (it.links > 1) parts.push(t("nLinks", it.links));
          if (it.sources > 1) parts.push(t("nSources", it.sources));
          return parts.join(" · ");
        }
        if (it.state === QUEUED) return waiting() ? t("waitsUntil", when(startAt)) : t("queued");
        if (it.state === PAUSED) return `${t("paused")} · ${human(it.downloaded)} / ${human(it.size)}`;
        if (it.state === ERROR) return it.error || t("failed");
        return [human(it.size), host(it.url)].filter(Boolean).join(" · ");
      }

      function rowHtml(it) {
        const pct = it.size ? Math.min(100, (it.downloaded / it.size) * 100) : 0;
        const fill = it.state === PAUSED ? "paused" : it.state === ERROR ? "error" : "";
        const actions =
          (it.state === RUNNING || it.state === QUEUED ? act("pause") : "") +
          (it.state === PAUSED || it.state === ERROR ? act("resume") : "") +
          (it.state === DONE ? act("reveal") : "") +
          act("remove", "rm");
        return `
          <div class="icon ${it.category || "other"}">${svg(GLYPH[it.category] || GLYPH.other)}</div>
          <div class="meta">
            <div class="name" title="${esc(it.filename)}">${esc(it.filename)}${it.sources > 1 ? '<span class="tag">net-merge</span>' : ""}</div>
            <div class="sub ${it.state === ERROR ? "err" : ""}">${esc(subline(it))}</div>
            ${it.state === DONE ? "" : `<div class="bar"><div class="fill ${fill}" style="width:${pct}%"></div></div>`}
          </div>
          <div class="right">${actions}</div>`;
      }

      function draw() {
        const inSettings = view === "settings";
        $("main").classList.toggle("settings", inSettings);
        document.querySelector(".side-foot .nav-item").classList.toggle("on", inSettings);
        for (const v of views) {
          const el = document.querySelector(`[data-view="${v.id}"]`);
          el.classList.toggle("on", v.id === view);
          el.querySelector(".count").textContent = items.filter(v.test).length || "";
        }
        if (inSettings) {
          $("title").textContent = t("settings");
          $("subtitle").textContent = t(tabKey(tab));
          for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.tab === tab);
          for (const page of document.querySelectorAll(".tab-page")) page.classList.toggle("on", page.dataset.tab === tab);
          return;
        }
        const current = views.find((v) => v.id === view) || views[0];
        const shown = items.filter((it) => current.test(it) && (!query || it.filename.toLowerCase().includes(query) || it.url.toLowerCase().includes(query)));
        if (!shown.some((it) => it.id === selected)) selected = null;

        const running = items.filter((it) => it.state === RUNNING);
        const speed = running.reduce((n, it) => n + (it.speed || 0), 0);
        $("title").textContent = t(current.id);
        const status = [running.length ? `${t("running", running.length)} · ${human(speed)}/s` : t(shown.length === 1 ? "item" : "items", shown.length)];
        if (waiting()) status.push(t("starts", when(startAt)));
        if (speedLimit) status.push(t("atMost", human(speedLimit)));
        $("subtitle").textContent = status.join(" · ");
        $("pauseAll").disabled = !items.some((it) => it.state === RUNNING || it.state === QUEUED);
        $("resumeAll").disabled = !items.some((it) => it.state === PAUSED);

        const list = $("list");
        const keep = new Map([...list.children].map((row) => [Number(row.dataset.id), row]));
        shown.forEach((it, i) => {
          let row = keep.get(it.id);
          keep.delete(it.id);
          if (!row) {
            row = document.createElement("div");
            row.className = "row";
            row.setAttribute("role", "option");
            row.dataset.id = it.id;
          }
          const html = rowHtml(it);
          if (row.dataset.html !== html) {
            row.innerHTML = html;
            row.dataset.html = html;
          }
          row.classList.toggle("sel", it.id === selected);
          row.setAttribute("aria-selected", it.id === selected);
          if (list.children[i] !== row) list.insertBefore(row, list.children[i] || null);
        });
        for (const row of keep.values()) row.remove();

        $("empty").style.display = shown.length ? "none" : "flex";
        $("emptyTitle").textContent = t(query ? "noResults" : items.length ? "emptyView" : "emptyNone");
        $("emptyText").textContent = query ? t("noResultsText", $("search").value.trim()) : t(items.length ? "emptyViewText" : "emptyNoneText");
        $("emptyAdd").hidden = !!(query || items.length);
      }

      const byId = (id) => items.find((it) => it.id === id);
      function run(name, it) {
        if (!it) return;
        if (name === "remove") call("remove", { id: it.id, delete: false });
        else if (name === "copy") copy(it.url);
        else call(name, { id: it.id }).catch(toast);
      }
      function select(id) {
        selected = id;
        draw();
      }

      $("list").addEventListener("click", (e) => {
        const row = e.target.closest(".row");
        if (!row) return;
        const id = Number(row.dataset.id);
        const button = e.target.closest("[data-act]");
        if (button) run(button.dataset.act, byId(id));
        else select(id);
      });
      $("list").addEventListener("dblclick", (e) => {
        const row = e.target.closest(".row");
        const it = row && !e.target.closest("[data-act]") && byId(Number(row.dataset.id));
        if (it?.state === DONE) run("open", it);
      });
      $("scroll").addEventListener("mousedown", (e) => {
        if (!e.target.closest(".row")) select(null);
      });

      // The right-click menu of a download; elsewhere none, as in a native window.
      const ctx = $("ctx");
      function menuFor(it) {
        const entries = [];
        if (it.state === DONE) entries.push("open");
        entries.push("reveal");
        if (it.state === RUNNING || it.state === QUEUED) entries.push("pause");
        if (it.state === PAUSED || it.state === ERROR) entries.push("resume");
        entries.push("copy", null, "remove");
        return entries.map((e) => (e ? `<button role="menuitem" data-act="${e}">${t(e)}</button>` : "<hr />")).join("");
      }
      document.addEventListener("contextmenu", (e) => {
        if (e.target.closest("input, textarea")) return;
        e.preventDefault();
        const row = e.target.closest(".row");
        if (!row) return closeMenu();
        const it = byId(Number(row.dataset.id));
        select(it.id);
        ctx.innerHTML = menuFor(it);
        ctx.dataset.id = it.id;
        ctx.classList.add("open");
        const x = Math.min(e.clientX, innerWidth - ctx.offsetWidth - 6);
        const y = Math.min(e.clientY, innerHeight - ctx.offsetHeight - 6);
        ctx.style.left = `${Math.max(6, x)}px`;
        ctx.style.top = `${Math.max(6, y)}px`;
      });
      ctx.addEventListener("click", (e) => {
        const button = e.target.closest("[data-act]");
        if (!button) return;
        const it = byId(Number(ctx.dataset.id));
        closeMenu();
        run(button.dataset.act, it);
      });
      function closeMenu() {
        ctx.classList.remove("open");
      }
      document.addEventListener("mousedown", (e) => {
        if (!e.target.closest(".ctx")) closeMenu();
      });
      window.addEventListener("blur", () => {
        closeMenu();
        root.classList.add("inactive");
      });
      window.addEventListener("focus", () => root.classList.remove("inactive"));
      $("scroll").addEventListener("scroll", closeMenu, { passive: true });

      function copy(text) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.append(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        toast(t(ok ? "copied" : "copyFailed"));
      }

      // The window is dragged by its toolbar and the top of the sidebar, and zoomed by a double click there, as the
      // title bar a macOS window no longer shows would.
      document.addEventListener("mousedown", (e) => {
        if (!mac || e.button !== 0 || !e.target.closest(".drag") || e.target.closest("button, input, label, a")) return;
        call(e.detail === 2 ? "zoom" : "drag").catch(() => {});
      });

      // Adding a link: one source, or several mirrors of one file merged (net-merge).
      let mode = "one";
      function setMode(next) {
        mode = next;
        for (const seg of document.querySelectorAll(".seg[data-mode]")) seg.classList.toggle("on", seg.dataset.mode === mode);
        $("oneBox").hidden = mode !== "one";
        $("manyBox").hidden = mode !== "many";
        (mode === "one" ? $("url") : $("mergeUrls")).focus();
      }
      function openAdd(url = "") {
        closeAll();
        $("addModal").classList.add("open");
        setMode(mode);
        if (url) $("url").value = url;
        if (mode === "one") $("url").select();
      }
      for (const seg of document.querySelectorAll(".seg[data-mode]")) seg.addEventListener("click", () => setMode(seg.dataset.mode));
      $("addOpen").addEventListener("click", () => openAdd());
      $("emptyAdd").addEventListener("click", () => openAdd());
      $("addCancel").addEventListener("click", closeAll);
      $("addForm").addEventListener("submit", (e) => {
        e.preventDefault();
        if (mode === "one") {
          const url = $("url").value.trim();
          if (!url) return;
          call("add", { url });
          $("url").value = "";
        } else {
          const urls = $("mergeUrls").value.split(/\s+/).map((s) => s.trim()).filter(Boolean);
          if (!urls.length) return;
          call("add", { urls });
          $("mergeUrls").value = "";
        }
        closeAll();
      });

      function closeAll() {
        closeMenu();
        for (const m of document.querySelectorAll(".modal")) m.classList.remove("open");
      }
      const anyOpen = () => !!document.querySelector(".modal.open");
      $("gear").addEventListener("click", () => go("settings"));
      for (const m of document.querySelectorAll(".modal")) m.addEventListener("mousedown", (e) => e.target === m && closeAll());
      $("pauseAll").addEventListener("click", () => call("pause_all"));
      $("resumeAll").addEventListener("click", () => call("resume_all"));

      // The keys of a Mac list: arrows move the selection, Return opens, Delete takes the row off the list.
      document.addEventListener("keydown", (e) => {
        const cmd = e.metaKey || e.ctrlKey;
        if (e.key === "Escape") {
          if (anyOpen() || ctx.classList.contains("open")) closeAll();
          else if (view === "settings") go(lastList);
          else if (document.activeElement === $("search")) { $("search").value = ""; query = ""; $("search").blur(); draw(); }
          else select(null);
          return;
        }
        if (cmd && e.key.toLowerCase() === "n") { e.preventDefault(); openAdd(); return; }
        if (cmd && e.key.toLowerCase() === "f") { e.preventDefault(); if (view === "settings") go(lastList); $("search").focus(); return; }
        if (cmd && e.key === ",") { e.preventDefault(); go("settings"); return; }
        if (anyOpen() || view === "settings" || e.target.closest("input, textarea, select")) return;
        const rows = [...$("list").children].map((row) => Number(row.dataset.id));
        const at = rows.indexOf(selected);
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          const next = rows[Math.max(0, Math.min(rows.length - 1, at + (e.key === "ArrowDown" ? 1 : -1)))];
          if (next != null) select(next);
          $("list").querySelector(".row.sel")?.scrollIntoView({ block: "nearest" });
        } else if (e.key === "Enter" && byId(selected)?.state === DONE) {
          run("open", byId(selected));
        } else if ((e.key === "Backspace" || e.key === "Delete") && selected != null) {
          e.preventDefault();
          run("remove", byId(selected));
        }
      });

      // A link pasted anywhere but a field opens the sheet with it.
      document.addEventListener("paste", (e) => {
        if (e.target.closest("input, textarea")) return;
        const text = (e.clipboardData?.getData("text") || "").trim();
        if (/^https?:\/\//i.test(text)) openAdd(text);
      });

      // Settings: appearance.
      $("language").addEventListener("change", () =>
        call("set_language", { language: $("language").value }).then((l) => {
          lang = l;
          $("language").value = l;
          applyLang();
          renderNet(lastNet);
          showSchedule(startAt);
        }).catch(() => {})
      );
      function showTheme(theme) {
        root.dataset.theme = theme;
        paintTheme();
        for (const seg of $("theme").children) seg.classList.toggle("on", seg.dataset.theme === theme);
      }
      $("theme").addEventListener("click", (e) => {
        const seg = e.target.closest("[data-theme]");
        if (seg) call("set_theme", { theme: seg.dataset.theme }).then(showTheme).catch(() => {});
      });
      function showGlass(on) {
        root.toggleAttribute("data-glass", on);
        paintTheme();
        $("glass").checked = on;
      }
      $("glass").addEventListener("change", () => call("set_glass", { on: $("glass").checked }).then(showGlass).catch(() => {}));

      // Settings: downloads, queue, network.
      const conns = $("conns");
      const paintRange = () => conns.style.setProperty("--p", `${((conns.value - conns.min) / (conns.max - conns.min)) * 100}%`);
      conns.addEventListener("input", () => { $("connsVal").textContent = conns.value; paintRange(); });
      conns.addEventListener("change", () => call("set_connections", { connections: Number(conns.value) }));
      $("folder").addEventListener("change", () => call("set_folder", { path: $("folder").value.trim() }));
      $("chooseFolder").addEventListener("click", async () => {
        const path = await call("choose_folder").catch(() => null);
        if (path) { $("folder").value = path; call("set_folder", { path }); }
      });
      $("classify").addEventListener("change", () =>
        call("set_classify", { on: $("classify").checked }).then((on) => ($("classify").checked = !!on)).catch(() => {})
      );
      $("netMerge").addEventListener("change", () =>
        call("set_net_merge", { on: $("netMerge").checked }).then((d) => { $("netMerge").checked = !!d.on; renderNet(d.net); }).catch(() => {})
      );

      // net-merge: each link with what it carries, or its state while it carries nothing.
      const NET_STATE = { idle: "netIdle", checking: "netChecking", up: "netUp", down: "netDown" };
      function renderNet(net) {
        lastNet = net;
        const box = $("nets");
        $("netsItem").hidden = !net || !$("netMerge").checked;
        if ($("netsItem").hidden) { box.replaceChildren(); return; }
        const rows = net.links.map((l) => {
          const name = l.label === l.name ? l.label : `${l.label} (${l.name})`;
          const state = l.connections ? t("netCarries", l.connections, human(l.speed)) : NET_STATE[l.state] ? t(NET_STATE[l.state]) : l.state;
          return `<div class="net"><span class="net-name">${esc(name)}${l.primary ? `<span class="tag">${t("netDefault")}</span>` : ""}</span><span class="net-state ${esc(l.state)}">${esc(state)}</span></div>`;
        });
        const note = net.paused ? "netVpn" : !net.links.length ? "netNone" : net.links.length === 1 ? "netOne" : "";
        box.innerHTML = rows.join("") + (note ? `<p class="hint">${esc(t(note))}</p>` : "");
      }

      $("maxActive").addEventListener("change", () => call("set_max_active", { n: Number($("maxActive").value) }));
      $("speedLimit").addEventListener("change", () =>
        call("set_speed_limit", { bytes: Number($("speedLimit").value) }).then((n) => { speedLimit = n; draw(); }).catch(() => {})
      );
      $("whenDone").addEventListener("change", () =>
        call("set_when_done", { action: $("whenDone").value }).then((a) => ($("whenDone").value = a)).catch(() => {})
      );
      $("watchClipboard").addEventListener("change", () =>
        call("set_watch_clipboard", { on: $("watchClipboard").checked }).then((on) => ($("watchClipboard").checked = !!on)).catch(() => {})
      );

      // The schedule is a time of day; the next time it comes is worked out here, in the user's own time zone.
      function nextAt(hhmm) {
        const [h, m] = (hhmm || "01:00").split(":").map(Number);
        const at = new Date();
        at.setHours(h, m, 0, 0);
        if (at <= new Date()) at.setDate(at.getDate() + 1);
        return Math.floor(at.getTime() / 1000);
      }
      function setSchedule() {
        const at = $("scheduleOn").checked ? nextAt($("scheduleTime").value) : 0;
        call("set_schedule", { start_at: at }).then(showSchedule).catch(() => {});
      }
      function showSchedule(at) {
        startAt = at || 0;
        $("scheduleOn").checked = startAt > 0;
        $("scheduleNote").textContent = startAt ? t("scheduleOn", when(startAt)) : t("scheduleOff");
        draw();
      }
      $("scheduleOn").addEventListener("change", setSchedule);
      $("scheduleTime").addEventListener("change", () => $("scheduleOn").checked && setSchedule());

      $("autostart").addEventListener("change", () =>
        call("set_autostart", { on: $("autostart").checked }).then((on) => ($("autostart").checked = !!on)).catch(() => {})
      );
      $("checkUpdate").addEventListener("click", () => { call("check_update"); toast(t("checking")); });
      $("extOpen").addEventListener("click", () => call("reveal_extension").catch(toast));

      // Update banner.
      $("bannerBtn").addEventListener("click", () => {
        $("bannerBtn").textContent = t("updating");
        $("bannerBtn").disabled = true;
        call("install_update");
      });

      let toastTimer;
      function toast(text) {
        $("toast").textContent = text;
        $("toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $("toast").classList.remove("show"), 3200);
      }

      const events = {
        hello(d) {
          const s = d.settings;
          $("version").textContent = d.version;
          conns.max = d.max_connections;
          conns.value = s.connections;
          $("connsVal").textContent = s.connections;
          paintRange();
          $("folder").value = s.download_dir;
          $("autostart").checked = d.autostart;
          $("classify").checked = s.classify;
          $("netMerge").checked = !!s.net_merge;
          $("extPath").value = d.extension_dir;
          $("maxActive").value = String(s.max_active ?? 3);
          speedLimit = s.speed_limit || 0;
          $("speedLimit").value = String(speedLimit);
          $("whenDone").value = s.when_done || "";
          $("watchClipboard").checked = !!s.watch_clipboard;
          lang = s.language === "en" ? "en" : "vi";
          $("language").value = lang;
          applyLang();
          showTheme(s.theme || "system");
          showGlass(!!s.glass);
          if (s.start_at) $("scheduleTime").value = clock(s.start_at);
          showSchedule(s.start_at);
        },
        list(data) {
          items = data;
          draw();
        },
        net: renderNet,
        toast,
        // From the menu bar and the tray.
        settings: () => go("settings"),
        autostart: (on) => ($("autostart").checked = on),
        // A link copied while the clipboard is watched.
        add: (url) => openAdd(url),
        schedule: showSchedule,
        when_done: (action) => ($("whenDone").value = action),
        update(d) {
          $("bannerTxt").textContent = t("updateOut", d.latest, d.current);
          $("banner").classList.add("show");
        },
        update_progress(p) {
          $("bannerBtn").textContent = t("updatingPct", p);
        },
        update_ready() {
          $("bannerTxt").textContent = t("updateReady");
          $("bannerBtn").textContent = t("restart");
          $("bannerBtn").disabled = false;
          $("bannerBtn").onclick = () => call("restart");
        },
      };

      $("language").value = lang;
      for (const seg of $("theme").children) seg.classList.toggle("on", seg.dataset.theme === (root.dataset.theme || "system"));
      applyLang();
      draw();
      call("ready").catch(() => {});
    </script>
  </body>
</html>
