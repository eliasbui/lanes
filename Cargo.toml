[package]
name = "lanes"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "A fast, open multi-connection download manager for macOS and Windows"
repository = "https://github.com/eliasbui/lanes"
license = "MIT"

[[bin]]
name = "lanes"
path = "src/main.rs"

[dependencies]
# The window and its web page, the tray icon and the notifications, the versions app-card-english ships.
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"
notify-rust = "4"
# The list of downloads and their segments, so a restart finds them again.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The download engine: blocking HTTP with range requests, one connection per segment, on rustls; with net-merge each
# connection goes through the app's own SOCKS5 proxy (src/netmerge.rs).
ureq = { version = "2", features = ["socks-proxy"] }
# net-merge: a socket bound to one network link before it connects, with a time limit on connecting.
socket2 = { version = "0.6", features = ["all"] }
# The update check verifies the SHA-256 that GitHub publishes.
sha2 = "0.10"
# HLS video: segment addresses relative to their playlist (already in the tree through ureq), and the AES-128 that
# many sites lock their segments with.
url = "2"
aes = "0.8"
cbc = "0.1"
# YouTube for signed-in viewers (src/extract/jsc.rs): its addresses carry a signature and an `n` value that the
# player's own script transforms, run in an embedded QuickJS by the solver of yt-dlp's EJS project; and the SAPISIDHASH
# its API wants from a signed-in session is a SHA-1.
rquickjs = "0.14"
sha1 = "0.10"
# TikTok's "please wait" page asks for a proof of work in base64 (src/extract/tiktok.rs).
base64 = "0.22"
# The Downloads folder and the home, wherever the system keeps them.
dirs = "7"
# The tray and window icons are decoded from PNG at startup.
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# net-merge: the interfaces and their addresses (getifaddrs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
