[package]
name = "lanes"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "A fast, open multi-connection download manager for macOS and Windows"
repository = "https://github.com/eliasbui/lanes"
license = "MIT"

[[bin]]
name = "lanes"
path = "src/main.rs"

[dependencies]
# The window and its web page, the tray icon and the notifications, the versions app-card-english ships.
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"
notify-rust = "4"
# The list of downloads and their segments, so a restart finds them again.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The download engine: blocking HTTP with range requests, one connection per segment, on rustls.
ureq = "2"
# The update check verifies the SHA-256 that GitHub publishes.
sha2 = "0.10"
# HLS video: segment addresses relative to their playlist (already in the tree through ureq), and the AES-128 that
# many sites lock their segments with.
url = "2"
aes = "0.8"
cbc = "0.1"
# The Downloads folder and the home, wherever the system keeps them.
dirs = "7"
# The tray and window icons are decoded from PNG at startup.
png = "0.18"

[dev-dependencies]
# Only the test that checks the extension id matches its key decodes base64.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
